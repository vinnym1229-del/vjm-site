name: Refresh VJM research snapshots

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Research group to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - options
          - daily
  schedule:
    - cron: '*/30 13-21 * * 1-5'
    - cron: '30 22 * * 1-5'

permissions:
  contents: read

concurrency:
  group: vjm-research-refresh-${{ github.event.schedule || inputs.scope || 'manual' }}
  cancel-in-progress: true

jobs:
  options:
    if: github.event.schedule == '*/30 13-21 * * 1-5' || inputs.scope == 'options' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$RESEARCH_REFRESH_URL" && test -n "$RESEARCH_CRON_SECRET"
      - name: Refresh QQQ and SPY option snapshots
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          refresh() {
            local endpoint="$1"
            local http_code response
            # Deliberately NOT --fail-with-body: `set -e` isn't on in this
            # loop so a failed curl never aborted the job, but the old
            # `if ! response="$(curl --fail-with-body ...)"` branch only ever
            # logged a generic "refresh request failed" — the actual error
            # body curl captured (e.g. "Alpaca snapshot timed out") was
            # thrown away, same class of bug already fixed in
            # content-sync.yml/morning-automation.yml. -o/-w capture status
            # and body separately so the real detail always reaches the log.
            #
            # --retry-max-time 45 caps that logging guarantee itself: run
            # 37372676106 (2026-10-05) hung past this job's own
            # timeout-minutes and got cancelled with nothing in the log at
            # all, because --max-time resets on every retry attempt instead
            # of bounding the total — `curl --retry 3 --max-time 90` can take
            # up to 4x90s=360s on a single endpoint that times out instead of
            # erroring fast, and this job calls it twice in a row. Once an
            # attempt has already burned past 45s, a retry would only risk
            # repeating that same multi-minute hang, so --retry-max-time
            # stops it from starting another one; a merely-slow-but-quick
            # transient failure still gets its retries within that budget.
            http_code="$(curl --silent --show-error --retry 3 --retry-max-time 45 --max-time 90 \
              -o /tmp/research-refresh-response.json -w '%{http_code}' \
              -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
              "${RESEARCH_REFRESH_URL%/}${endpoint}")" || true
            response="$(cat /tmp/research-refresh-response.json 2>/dev/null || true)"
            if ! RESPONSE="$response" HTTP_CODE="$http_code" node -e '
              const code = Number(process.env.HTTP_CODE);
              let p = null;
              try { p = JSON.parse(process.env.RESPONSE); } catch {}
              if (!p || !p.ok) {
                const detail = p ? (p.error || "refresh reported failure") :
                  "no parseable JSON body — Cloudflare/edge error page, not the Function itself";
                console.error(`refresh failed (HTTP ${code}): ${detail}`);
                process.exit(1);
              }
              console.log(p.module, p.asOf);
            '; then
              echo "::warning::${endpoint} failed"
              failed=1
            fi
          }
          refresh "/api/research-engine?module=options&symbol=QQQ&expiryDays=7"
          refresh "/api/research-engine?module=options&symbol=SPY&expiryDays=7"
          exit "$failed"

  daily:
    if: github.event.schedule == '30 22 * * 1-5' || inputs.scope == 'daily' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    # 11 sequential refresh calls x up to 120s each (see that step's
    # --retry-max-time comment) = up to 1320s worst case; 20 min (1200s)
    # left no margin and could cancel the job mid-run with no error logged.
    timeout-minutes: 25
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$RESEARCH_REFRESH_URL" && test -n "$RESEARCH_CRON_SECRET"
      - name: Refresh daily research modules
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          refresh() {
            local endpoint="$1"
            local http_code response
            # See the options job's identical helper for why this isn't
            # --fail-with-body: that pattern silently threw away the real
            # error body on failure. -o/-w capture status and body
            # separately so the actual detail always reaches the log.
            #
            # --retry-max-time 60 caps that logging guarantee itself (see the
            # options job's comment for the 2026-10-05 incident that exposed
            # this): this job chains 11 sequential refresh calls, so even
            # without it ever firing a retry, 11x120s=1320s alone already
            # exceeds this job's 20-minute timeout-minutes -- a hang on
            # almost any one of them cancels the whole job with no log line.
            # Capping retries so a near-full-length attempt never repeats,
            # paired with the timeout-minutes bump below, keeps the worst
            # case (11 single attempts, no retries) inside the job timeout.
            http_code="$(curl --silent --show-error --retry 3 --retry-max-time 60 --max-time 120 \
              -o /tmp/research-refresh-response.json -w '%{http_code}' \
              -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
              "${RESEARCH_REFRESH_URL%/}${endpoint}")" || true
            response="$(cat /tmp/research-refresh-response.json 2>/dev/null || true)"
            if ! RESPONSE="$response" HTTP_CODE="$http_code" node -e '
              const code = Number(process.env.HTTP_CODE);
              let p = null;
              try { p = JSON.parse(process.env.RESPONSE); } catch {}
              if (!p || !p.ok) {
                const detail = p ? (p.error || "refresh reported failure") :
                  "no parseable JSON body — Cloudflare/edge error page, not the Function itself";
                console.error(`refresh failed (HTTP ${code}): ${detail}`);
                process.exit(1);
              }
              console.log(p.module, p.asOf);
            '; then
              echo "::warning::${endpoint} failed"
              failed=1
            fi
          }
          refresh "/api/research-engine?module=intraday&symbol=QQQ&days=20"
          refresh "/api/research-engine?module=intraday&symbol=SPY&days=20"
          refresh "/api/research-engine?module=sectors"
          refresh "/api/research-engine?module=biotech"
          for symbol in QQQ SPY NVDA AAPL MSFT AMD TSLA; do
            refresh "/api/research-engine?module=stock&symbol=${symbol}&lookback=1095&horizon=40&timeframe=combined&pivot=5"
          done
          exit "$failed"
