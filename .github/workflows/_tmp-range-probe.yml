name: TEMP range probe (auto-removed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://pj.vjm.pages.dev
    steps:
      - name: Range support on /assets/pj-intro.mp4 (static path currently wired)
        run: |
          set -x
          curl -s -D - -o /dev/null -H "Range: bytes=0-99" "$SITE/assets/pj-intro.mp4"
      - name: Range support on /video/pj-intro.mp4 (KV-backed Function route)
        run: |
          set -x
          curl -s -D - -o /dev/null -H "Range: bytes=0-99" "$SITE/video/pj-intro.mp4"
      - name: HEAD on both paths
        run: |
          set -x
          curl -s -D - -o /dev/null -I "$SITE/assets/pj-intro.mp4"
          curl -s -D - -o /dev/null -I "$SITE/video/pj-intro.mp4"
