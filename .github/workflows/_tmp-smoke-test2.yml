name: TEMP smoke test 2 (auto-removed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://pj.vjm.pages.dev
    steps:
      - name: GET /api/verify-premium (session state)
        run: |
          set -euo pipefail
          curl -s "$SITE/api/verify-premium"
          echo ""

      - name: POST /api/auth-google with a bad credential
        run: |
          set -euo pipefail
          curl -s -X POST "$SITE/api/auth-google" -H 'Content-Type: application/json' -d '{"credential":"bad.bad.bad"}'
          echo ""
