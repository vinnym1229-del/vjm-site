name: TEMP live probe (auto-removed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://pj.vjm.pages.dev
    steps:
      - name: HTML pages return 200
        run: |
          set -x
          for path in / /404 /forex-calendar /futures-dissection /options-lab /premarket /premium-guidance /privacy /prop-firms /psychology-enhancer /research-engine /risk-disclosure /stock-breakdown /stock-lab /terms /unsubscribe; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$path")
            echo "$path -> $code"
          done
      - name: JSON API endpoints return ok:true
        run: |
          set -x
          curl -s "$SITE/api/ticker" | head -c 500; echo
          curl -s "$SITE/api/yahoo-news?symbol=AAPL" | head -c 500; echo
          curl -s "$SITE/api/stock-research?symbol=AAPL" | head -c 500; echo
          curl -s "$SITE/api/content?type=schedule" | head -c 500; echo
      - name: Diagnostic -- CDN cache status on the two Alpaca-backed endpoints
        run: |
          set -x
          echo "--- ticker (repeat x3) ---"
          for i in 1 2 3; do curl -s -D - -o /dev/null "$SITE/api/ticker" | grep -i "^cf-cache-status\|^cf-ray\|^age:"; done
          echo "--- stock-research (repeat x3) ---"
          for i in 1 2 3; do curl -s -D - -o /dev/null "$SITE/api/stock-research?symbol=AAPL" | grep -i "^cf-cache-status\|^cf-ray\|^age:"; done
      - name: verify-premium bad code with no turnstileToken stays gated
        run: |
          set -x
          curl -s -X POST "$SITE/api/verify-premium" \
            -H "Content-Type: application/json" \
            -d '{"code":"bad-code-000000"}'
          echo
