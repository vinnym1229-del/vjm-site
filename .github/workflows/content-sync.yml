# Pull the owner's Google Sheet into the live site.
#
# functions/api/content-sync.js has always described itself as running "hourly
# via GitHub Actions" — but this workflow did not exist, so the sync had never
# run once. The live `site_content` table is empty as a result: the prop-firm
# directory shows its "not connected yet" state to real visitors, and every
# CMS-driven section (schedule, team, FAQs, bundles, stats, results) silently
# falls back to whatever is hard-coded in the HTML.
#
# With this in place the owner edits a spreadsheet tab and the website updates
# itself within the hour. No deploy, no code edit, nobody in the loop.
#
# PREREQUISITE, and it is not obvious: GitHub only registers and runs
# workflows that exist on the repository's DEFAULT branch. This repo's default
# is still an old Pine Script branch that contains no .github directory, so the
# API currently reports zero workflows and none of them — this one, the
# research refresh, or the morning automation — has ever run. Switching the
# default branch to `pj` is what turns them all on. See docs/OWNER-CHECKLIST.md
# item 0.
#
# Requires the SAME two repository secrets the research refresh already uses:
#   RESEARCH_REFRESH_URL   the site origin, e.g. https://not-financial-advice-vjm.com
#   RESEARCH_CRON_SECRET   must equal RESEARCH_CRON_SECRET in Cloudflare Pages
# and, in Cloudflare Pages, CONTENT_BRIDGE_URL + CONTENT_BRIDGE_SECRET pointing
# at the Apps Script bridge (see docs/APPS-SCRIPT-INTEGRATION.md).

name: Sync site content from the owner's sheet

on:
  workflow_dispatch: {}
  schedule:
    # Hourly. The sync is one authenticated request and a D1 upsert, so the
    # cost of running it often is nil, while the cost of running it rarely is a
    # schedule change or a promo code sitting stale on a live page for a day.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: vjm-content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: |
          test -n "$RESEARCH_REFRESH_URL" || { echo "RESEARCH_REFRESH_URL secret is not set"; exit 1; }
          test -n "$RESEARCH_CRON_SECRET" || { echo "RESEARCH_CRON_SECRET secret is not set"; exit 1; }

      # TEMPORARY diagnostic, kept until BOTH of these are actually fixed:
      #
      # 1. The custom domain 502s on POST /api/content-sync with a bare
      #    "error code: 502" (no JSON — an edge failure, not the Function
      #    throwing), while root ("/") and another /api/* route (GET
      #    /api/content) both 200 with real responses on this same domain.
      #    So it isn't DNS/SSL/the domain's Pages attachment, and it isn't
      #    /api/* routing generally — something scoped to exactly this one
      #    path is intercepting it before the Pages Function runs. Most
      #    likely: a Workers Route or a Rule (Redirect/Transform/WAF) bound
      #    to this specific path on the zone — check Cloudflare dashboard ->
      #    Workers & Pages -> Workers Routes, and Rules, for anything
      #    matching "/api/content-sync". .pages.dev sits outside this zone,
      #    which is why it's unaffected and still the only place to see the
      #    Function's real response.
      # 2. That real response is itself a rejection: "bridge rejected the
      #    request: not configured" — the Apps Script project behind the
      #    CURRENT deployment URL has no CONTENT_BRIDGE_SECRET in its Script
      #    Properties, i.e. setUp() has not been run successfully in THAT
      #    project (a new deployment does not imply setUp() ran there — see
      #    docs/OWNER-CHECKLIST.md item 6).
      #
      # Once both are fixed this step (and the "no parseable JSON body"
      # branch below) can go — remove this step and switch the main step
      # back to querying $RESEARCH_REFRESH_URL directly.
      - name: Diagnostic — same POST against the .pages.dev alias
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          code="$(curl --silent --show-error --retry 2 --max-time 30 \
            -o /tmp/pages-dev-response.json -w '%{http_code}' \
            -X POST \
            -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
            "https://vjm.pages.dev/api/content-sync")"
          echo "vjm.pages.dev HTTP status: $code"
          echo "--- body ---"
          cat /tmp/pages-dev-response.json || true
          echo ""
          echo "------------"

      # TEMPORARY: settle whether Cloudflare and Apps Script actually agree on
      # the secret, after several careful re-pastes of CONTENT_BRIDGE_SECRET
      # still produced "unauthorized". Hits the debug fingerprint branch added
      # to doGet() in apps-script/content-sync/Code.gs, which reveals only the
      # stored secret's length and first/last 4 characters — never the whole
      # value. Remove this step (and the debug branch in Code.gs) once the
      # mismatch, or lack of one, is confirmed.
      - name: Diagnostic — Apps Script secret fingerprint
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          code="$(curl --silent --show-error -L --retry 2 --max-time 30 \
            -o /tmp/fingerprint.json -w '%{http_code}' \
            "https://script.google.com/macros/s/AKfycbyNEZ-qkLS2rUKEADTcQcL7eEgCnFrF9BzW00tioPSZPXOkMtJsoelLVJeUbKyIOyQj/exec?debug=fingerprint")"
          echo "Fingerprint check HTTP status: $code"
          echo "--- body ---"
          cat /tmp/fingerprint.json || true
          echo ""
          echo "------------"

      - name: Pull the sheet into D1
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately NOT --fail-with-body: that makes curl's own non-zero
          # exit trip `set -e` on the very next line, which killed the script
          # before the response body was ever read — every past failure of
          # this job showed a bare "curl: (22) ... 502" with the actual error
          # detail from the Function (or proof there wasn't one) thrown away.
          # -o/-w capture status and body separately so both get printed
          # regardless of outcome, and the JSON is what decides success here.
          http_code="$(curl --silent --show-error --retry 3 --max-time 90 \
            -o /tmp/content-sync-response.json -w '%{http_code}' \
            -X POST \
            -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
            "${RESEARCH_REFRESH_URL%/}/api/content-sync")"
          echo "HTTP status: $http_code"
          echo "--- response body ---"
          cat /tmp/content-sync-response.json || true
          echo ""
          echo "---------------------"
          # Fail loudly on ok:false. A sync that 200s while storing nothing is
          # the failure mode that goes unnoticed for weeks, because the site
          # keeps serving the last good copy and looks fine.
          RESPONSE="$(cat /tmp/content-sync-response.json)" HTTP_CODE="$http_code" node -e '
            const code = Number(process.env.HTTP_CODE);
            let p = null;
            try { p = JSON.parse(process.env.RESPONSE); } catch {}
            if (!p || !p.ok) {
              const detail = p ? (p.error || "sync reported failure") :
                "no parseable JSON body — this is a Cloudflare/edge error page, not a response from the Function itself";
              console.error(`Sync failed (HTTP ${code}): ${detail}`);
              process.exit(1);
            }
            const s = p.summary || {};
            const rows = Object.entries(s).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`);
            console.log(rows.length ? rows.join("  ") : "(no rows returned)");
          '
