# Run the test suite on every push and pull request.
#
# Every other workflow in this repo is workflow_dispatch/schedule-only, so
# `npm test` (the full suite: security auth, quiz-grading integrity,
# entitlements, accessibility regressions, and every functions/api/*.js
# endpoint) never ran automatically anywhere — a push straight to `pj` (the
# branch Cloudflare Pages deploys from) or a PR against it got zero
# feedback, indistinguishable from a passing check. This closes that gap.
#
# Deliberately no hardcoded test count here: it drifted stale (474 -> 549,
# undetected for 5 days across dozens of commits touching tests/) because
# nothing checked it. Describing coverage by area instead of by number means
# it can't drift again.

name: Test suite

on:
  push:
    branches: [pj]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vjm-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json's test script passes node --test a quoted glob
          # ("tests/*.test.mjs") for it to expand itself rather than the
          # shell. Node 20.20.2 doesn't support that and fails with
          # "Could not find 'tests/*.test.mjs'" (reproduced directly);
          # Node 22 resolves the glob correctly, matching local dev.
          node-version: '22'

      - name: Run test suite
        run: npm test
