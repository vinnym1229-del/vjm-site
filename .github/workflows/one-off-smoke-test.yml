name: One-off smoke test
on: workflow_dispatch

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pages
        run: |
          set -e
          pages="/ /index.html /futures-dissection.html /options-lab.html /psychology-enhancer.html /stock-breakdown.html /stock-lab.html /research-engine.html /premium-guidance.html /forex-calendar.html /premarket.html /prop-firms.html /privacy.html /terms.html /risk-disclosure.html /404.html /unsubscribe.html"
          for p in $pages; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://pj.vjm.pages.dev$p")
            echo "$p -> $code"
          done
      - name: Probe JSON endpoints
        run: |
          set -e
          for u in "/api/ticker" "/api/yahoo-news?symbol=AAPL" "/api/stock-research?symbol=AAPL" "/api/content?type=schedule"; do
            echo "== $u =="
            curl -s --max-time 15 "https://pj.vjm.pages.dev$u" | head -c 400
            echo
          done
      - name: Probe verify-premium bad code (no turnstileToken)
        run: |
          curl -s --max-time 15 -X POST "https://pj.vjm.pages.dev/api/verify-premium" \
            -H "Content-Type: application/json" \
            -d '{"code":"BADCODE-0000"}'
          echo
