name: TEMP smoke test (auto-removed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://pj.vjm.pages.dev
    steps:
      - name: HTML pages return 200
        run: |
          set -euo pipefail
          fail=0
          for p in / /index.html /futures-dissection.html /options-lab.html /stock-breakdown.html /psychology-enhancer.html /premium-guidance.html /prop-firms.html /forex-calendar.html /premarket.html /research-engine.html /stock-lab.html /unsubscribe.html /privacy.html /terms.html /risk-disclosure.html /404.html; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -L "$SITE$p")"
            echo "$p -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          exit $fail

      - name: favicon asset resolves and pages reference it
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE/assets/pj-logo.jpg")"
          echo "/assets/pj-logo.jpg -> $code"
          [ "$code" = "200" ]
          for p in /options-lab.html /research-engine.html /404.html /unsubscribe.html; do
            body="$(curl -s "$SITE$p")"
            echo "$p favicon line:"
            echo "$body" | grep -o '<link rel="icon"[^>]*>' || true
          done

      - name: JSON endpoints return ok:true
        run: |
          set -euo pipefail
          for p in /api/ticker "/api/yahoo-news?symbol=AAPL" "/api/stock-research?symbol=AAPL" "/api/content?type=schedule"; do
            body="$(curl -s "$SITE$p")"
            echo "$p -> $body" | head -c 500
            echo ""
            echo "$body" | node -e '
              let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                let j; try { j = JSON.parse(d); } catch(e){ console.error("NOT JSON"); process.exit(1); }
                if (j.ok !== true) { console.error("ok is not true"); process.exit(1); }
                console.log("ok:true confirmed");
              });'
          done

      - name: verify-premium rejects bad code with no turnstile token
        run: |
          set -euo pipefail
          body="$(curl -s -X POST "$SITE/api/verify-premium" -H 'Content-Type: application/json' -d '{"code":"BADCODE123"}')"
          echo "response: $body"
          echo "$body" | node -e '
            let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
              let j; try { j = JSON.parse(d); } catch(e){ console.error("NOT JSON"); process.exit(1); }
              if (j.ok !== false) { console.error("ok is not false"); process.exit(1); }
              console.log("verification-failed message confirmed:", j.error);
            });'
