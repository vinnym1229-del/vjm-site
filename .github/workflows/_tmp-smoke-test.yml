name: TEMP smoke test (auto-removed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://pj.vjm.pages.dev
    steps:
      - name: diagnose options-lab.html deploy staleness
        run: |
          set -euo pipefail
          echo "--- response headers ---"
          curl -sI "$SITE/options-lab.html"
          echo "--- head bytes 0-3000 ---"
          curl -s "$SITE/options-lab.html" | head -c 3000
          echo ""
          echo "--- grep for pj-logo or logo-nav or data:image ---"
          curl -s "$SITE/options-lab.html" | grep -o 'pj-logo[^"]*\|logo-nav[^"]*\|data:image/svg[^"]\{0,40\}' || echo "none found"
