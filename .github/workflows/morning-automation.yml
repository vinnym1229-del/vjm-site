name: Morning automation (pre-market brief + content sync)

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which automation to run
        default: all
        type: choice
        options: [all, brief, content]
  # 12:30 UTC = 8:30 AM ET while US daylight saving is active (mid-Mar→early Nov).
  # During standard time it fires at 7:30 AM ET — still premarket. Adjust once
  # per season if exact timing matters (GitHub cron is UTC-only).
  #
  # No standalone hourly trigger here: this used to also carry '0 * * * *' for
  # the content job below, which meant every hour, 24/7, two independent
  # workflows (this one and content-sync.yml, cron '17 * * * *') hit
  # /api/content-sync with the same payload back to back — double load on the
  # Apps Script bridge and D1, and two runners racing the same sheet read.
  # content-sync.yml is the dedicated, better-error-handled owner of the
  # hourly cadence; the content job below now only piggybacks on the weekday
  # premarket run alongside the brief.
  schedule:
    - cron: '30 12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: vjm-automation-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  brief:
    if: github.event.schedule == '30 12 * * 1-5' || inputs.job == 'brief' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: |
          missing=""
          [ -n "$RESEARCH_REFRESH_URL" ] || missing="$missing RESEARCH_REFRESH_URL"
          [ -n "$RESEARCH_CRON_SECRET" ] || missing="$missing RESEARCH_CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing" >&2
            echo "Set them under Settings > Secrets and variables > Actions." >&2
            echo "RESEARCH_REFRESH_URL must point at the deployment that serves" >&2
            echo "the pj Functions, e.g. https://pj.vjm.pages.dev" >&2
            exit 1
          fi
      - name: Generate today's pre-market brief
        run: |
          set -euo pipefail
          # Deliberately NOT --fail-with-body: that makes curl's own non-zero
          # exit trip `set -e` on the very next line, which killed the script
          # before the response body was ever read (see content-sync.yml,
          # which hits the same pattern against /api/content-sync). -o/-w
          # capture status and body separately so both get printed regardless
          # of outcome, and the JSON is what decides success here.
          http_code="$(curl --silent --show-error --retry 2 --max-time 120 \
            -o /tmp/brief-response.json -w '%{http_code}' \
            -X POST \
            -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
            "${RESEARCH_REFRESH_URL%/}/api/market-brief")"
          echo "HTTP status: $http_code"
          echo "--- response body ---"
          cat /tmp/brief-response.json || true
          echo ""
          echo "---------------------"
          RESPONSE="$(cat /tmp/brief-response.json)" HTTP_CODE="$http_code" node -e '
            const code = Number(process.env.HTTP_CODE);
            let p = null;
            try { p = JSON.parse(process.env.RESPONSE); } catch {}
            if (!p || !p.ok) {
              const detail = p ? (p.error || "brief generation reported failure") :
                "no parseable JSON body — this is a Cloudflare/edge error page, not a response from the Function itself";
              console.error(`Brief generation failed (HTTP ${code}): ${detail}`);
              process.exit(1);
            }
            console.log("brief ok: true | discordPosted:", p.discordPosted, "| discordDetail:", p.discordDetail || "(none)");
          '

  content:
    if: github.event.schedule == '30 12 * * 1-5' || inputs.job == 'content' || inputs.job == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Sync owner content from Google Sheets
        run: |
          set -euo pipefail
          # Deliberately NOT --fail-with-body: see content-sync.yml, which
          # hits this same endpoint and documents why (`set -e` trips on the
          # `response=$(...)` line before the diagnostic ever runs, throwing
          # away the real error). -o/-w capture status and body separately.
          http_code="$(curl --silent --show-error --retry 2 --max-time 60 \
            -o /tmp/content-response.json -w '%{http_code}' \
            -X POST \
            -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
            "${RESEARCH_REFRESH_URL%/}/api/content-sync")"
          echo "HTTP status: $http_code"
          echo "--- response body ---"
          cat /tmp/content-response.json || true
          echo ""
          echo "---------------------"
          RESPONSE="$(cat /tmp/content-response.json)" HTTP_CODE="$http_code" node -e '
            const code = Number(process.env.HTTP_CODE);
            let p = null;
            try { p = JSON.parse(process.env.RESPONSE); } catch {}
            if (!p || !p.ok) {
              const detail = p ? (p.error || "sync reported failure") :
                "no parseable JSON body — this is a Cloudflare/edge error page, not a response from the Function itself";
              console.error(`Sync failed (HTTP ${code}): ${detail}`);
              process.exit(1);
            }
            const s = p.summary || {};
            const rows = Object.entries(s).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`);
            console.log("sync ok: true |", rows.length ? rows.join("  ") : "(no rows returned)");
          '
