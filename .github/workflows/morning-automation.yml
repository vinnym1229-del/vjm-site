name: Morning automation (pre-market brief + content sync)

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which automation to run
        default: all
        type: choice
        options: [all, brief, content]
  # 12:30 UTC = 8:30 AM ET while US daylight saving is active (mid-Mar→early Nov).
  # During standard time it fires at 7:30 AM ET — still premarket. Adjust once
  # per season if exact timing matters (GitHub cron is UTC-only).
  schedule:
    - cron: '30 12 * * 1-5'
    - cron: '0 * * * *'   # hourly content sync

permissions:
  contents: read

concurrency:
  group: vjm-automation-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  brief:
    if: github.event.schedule == '30 12 * * 1-5' || inputs.job == 'brief' || inputs.job == 'all' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$RESEARCH_REFRESH_URL" && test -n "$RESEARCH_CRON_SECRET"
      - name: Generate today's pre-market brief
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 120 \
            -X POST \
            -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
            "${RESEARCH_REFRESH_URL%/}/api/market-brief")"
          RESPONSE="$response" node -e "const p=JSON.parse(process.env.RESPONSE); console.log('brief ok:', p.ok, '| discord:', p.discordDetail || p.brief && p.discordPosted)"

  content:
    if: github.event.schedule == '0 * * * *' || github.event.schedule == '30 12 * * 1-5' || inputs.job == 'content' || inputs.job == 'all' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RESEARCH_REFRESH_URL: ${{ secrets.RESEARCH_REFRESH_URL }}
      RESEARCH_CRON_SECRET: ${{ secrets.RESEARCH_CRON_SECRET }}
    steps:
      - name: Sync owner content from Google Sheets
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --max-time 60 \
            -X POST \
            -H "X-Research-Cron: $RESEARCH_CRON_SECRET" \
            "${RESEARCH_REFRESH_URL%/}/api/content-sync")"
          RESPONSE="$response" node -e "const p=JSON.parse(process.env.RESPONSE); console.log('sync ok:', p.ok, JSON.stringify(p.summary||{}))"
