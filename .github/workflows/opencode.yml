# OpenCode GitHub agent — triggered by commenting /oc or /opencode on any
# issue or PR thread. Requires one-time setup by the owner:
#   1. Install the app: https://github.com/apps/opencode-agent (on this repo)
#   2. Repo Settings → Secrets and variables → Actions → add ANTHROPIC_API_KEY
# Docs: https://opencode.ai/docs/github/

name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-20250514
